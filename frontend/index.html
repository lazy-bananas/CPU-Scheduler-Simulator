<!DOCTYPE html>
<html>
<head>
    <title>CPU Scheduling Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class='container'>

    <button id="themeBtn">Dark mode</button>

    <h1>CPU Scheduling Simulator</h1>

    <!-- Algorithm Selection -->
    <label>Algorithm:</label>
    <select id="algorithm">
        <option value="fcfs">FCFS</option>
        <option value="sjf">SJF (Non-Preemptive)</option>
        <option value="srtf">SJF (Preemptive)</option>
        <option value="nonpre_prior">Priority (Non-Preemptive)</option>
        <option value="pre_prior">Priority (Preemptive)</option>
        <option value="round_robin">Round Robin</option>
    </select>

    <!-- Quantum (only for RR) -->
    <input type="number" id="quantum" placeholder="Time Quantum" style="display:none;">

    <br><br>
    
    <button id="addBtn">Add Process</button>


    <br><br>

    <!-- Process Table -->
    <table id="processTable">
        <thead>
            <tr>
                <th>PID</th>
                <th>Arrival Time</th>
                <th>Burst Time</th>
                <th>Priority</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
    </table>

    
    <br><br>

    <button id="calcBtn">Calculate</button>
    <button id="compareBtn">Compare All</button>
    <button id="clearBtn">Clear All</button>

    <div id="comparisonSection" style="display:none;">
        <h2>Algorithm Comparison</h2>
        <table id="comparisonTable"></table>
    </div>

    <!-- Output -->
    <h2>Results</h2>
    <table id="resultTable"></table>

    <h3>Average Waiting Time: <span id="avgWT"></span></h3>
    <h3>Average Turnaround Time: <span id="avgTAT"></span></h3>

    <h2>Gantt Chart</h2>
    <div id="gantt"></div>

    <h2>Process Timelines</h2>
    <div id="processCharts"></div>

    <script type="module" src="main.js"></script>
</div>
</body>
</html>
